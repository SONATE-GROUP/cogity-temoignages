    colors: {
      navy:      { 950:'#060D28', 900:'#0B1740', 800:'#162D70' },

<style>
  /* overflow-x reste uniquement sur html : le poser aussi sur body transforme
     body en conteneur de scroll et casse position:sticky sur le header. */
  html { overflow-x: hidden; scroll-behavior: smooth; }
  body { max-width: 100%; }
  /* La graisse des titres est posée en classe utilitaire (font-bold) :
     le preflight Tailwind applique h1-h6 { font-weight: inherit }, et son CSS,
     injecté par le CDN à l'exécution, passe après ce bloc dans la cascade —
     une règle font-weight posée ici sur h1/h2 serait donc écrasée.
     Seul l'interlettrage tient, le preflight ne le réinitialise pas.
     -0.025em = le tracking-tight que le site pose sur chacun de ses titres.
     h3 est hors de la règle : le site ne resserre pas ses h3. */
  h1, h2 { letter-spacing: -0.025em; }
  .eyebrow { font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  /* Trame du hero, reprise du site */

      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);

  .reveal.vu { opacity: 1; transform: none; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #2540EA; outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>

  header() + `<main>` + hero() + contraste()

/* ============================================================
   3. COMPORTEMENTS
   ============================================================ */
const obs = new IntersectionObserver((entrees) => {
  entrees.forEach(x => { if (x.isIntersecting) { x.target.classList.add('vu'); obs.unobserve(x.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

const utm = {};
new URLSearchParams(location.search).forEach((v, k) => { if (k.startsWith('utm_')) utm[k] = v; });

window.dataLayer = window.dataLayer || [];
document.querySelectorAll('[data-cta]').forEach(a => {
  a.addEventListener('click', () => {
    window.dataLayer.push({
      event: 'demo_click',
      campaign: DATA.campagne.nom,
      source_url: location.href,
      timestamp: new Date().toISOString(),
      ...utm
    });
  });
});

/* ============================================================
   4. CONSENTEMENT ET TAGS
   ============================================================ */
function chargerTags() {
  if (DATA.tracking.gtmId) {
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
    var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;
    j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);})
    (window,document,'script','dataLayer',DATA.tracking.gtmId);
  }
}

(function banniere() {
  if (!DATA.tracking.gtmId && !DATA.tracking.metaPixelId) return;
  const choix = localStorage.getItem('cogity_consent');
  if (choix === 'ok') { chargerTags(); return; }
  if (choix === 'non') return;

  const b = document.createElement('div');
  b.className = 'fixed bottom-0 inset-x-0 z-50 border-t border-slate-200 bg-white p-5 shadow-lg';
  b.innerHTML = `
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      <p class="text-sm text-slate-600 max-w-lisible">
        Nous utilisons des cookies de mesure d’audience pour savoir quelles pages sont consultées.
        Aucun cookie n’est déposé sans votre accord.
      </p>
      <div class="flex gap-3 shrink-0">
        <button data-refus class="rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-medium">Refuser</button>
        <button data-accord class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white">Accepter</button>
      </div>
    </div>`;
  document.body.appendChild(b);
  b.querySelector('[data-accord]').onclick = () => { localStorage.setItem('cogity_consent','ok'); chargerTags(); b.remove(); };
  b.querySelector('[data-refus]').onclick  = () => { localStorage.setItem('cogity_consent','non'); b.remove(); };
})();
</script>
