<style>

  /* La graisse des titres est posée en classe utilitaire (font-bold), comme
     sur le site : le preflight Tailwind applique h1-h6 { font-weight: inherit }.
     Seul l'interlettrage est posé ici, le preflight ne le réinitialise pas.
     -0.025em = le tracking-tight que le site pose sur chacun de ses titres.
     h3 est hors de la règle : le site ne resserre pas ses h3. */
  h1, h2 { letter-spacing: -0.025em; }

  .a-valider { background: #FDE047; color: #060D28; padding: 0 .25em; border-radius: 3px; }

  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #2540EA; outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>

const UTM = (() => {
  const depuisUrl = {};
  const q = new URLSearchParams(location.search);
  UTM_KEYS.forEach(k => { const v = q.get(k); if (v) depuisUrl[k] = v; });
  try {
    if (Object.keys(depuisUrl).length) sessionStorage.setItem('cogity_utm', JSON.stringify(depuisUrl));

  } catch (err) { /* stockage bloqué : on garde les UTM de l'URL */ }
  return depuisUrl;
})();

    return u.toString();
  } catch (err) { return CONVERSION.calendarUrl; }
};

  const lignes = Object.entries(UTM).map(([k, v]) => `${k}=${v}`);
  const corps = lignes.length ? `\n\n\n---\n${lignes.join('\n')}` : '';
  return `mailto:${dest}?subject=${encodeURIComponent(DATA.final.sujetMail)}`
    + (corps ? `&body=${encodeURIComponent(corps)}` : '');
};

const obs = new IntersectionObserver((entrees) => {
  entrees.forEach(x => { if (x.isIntersecting) { x.target.classList.add('vu'); obs.unobserve(x.target); } });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

window.dataLayer = window.dataLayer || [];
document.querySelectorAll('[data-cta]').forEach(a => {
  a.addEventListener('click', () => {
    window.dataLayer.push({
      event: 'demo_click',
      campaign: DATA.campagne.nom,
      source_url: location.href,
      timestamp: new Date().toISOString(),
      persona: PERSONA || '',
      ...UTM
    });
  });
});

/* ============================================================
   4. CONSENTEMENT ET TAGS
   ============================================================ */
const CONSENT_KEY = 'cogity_consent';
const lireChoix = () => { try { return localStorage.getItem(CONSENT_KEY); } catch (err) { return null; } };
const ecrireChoix = (v) => { try { v ? localStorage.setItem(CONSENT_KEY, v) : localStorage.removeItem(CONSENT_KEY); } catch (err) {} };

function chargerTags() {
  if (!GTM_ID || window.__gtm) return;
  window.__gtm = true;
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);})
  (window,document,'script','dataLayer',GTM_ID);
}

function banniere() {
  if (!GTM_ID || document.getElementById('bandeau-cookies')) return;
  const b = document.createElement('div');
  b.id = 'bandeau-cookies';
  b.setAttribute('role', 'dialog');
  b.setAttribute('aria-label', 'Cookies');
  b.className = 'fixed bottom-0 inset-x-0 z-50 border-t border-slate-200 bg-white p-5 shadow-lg';
  b.innerHTML = `
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      <p class="text-sm text-slate-600 max-w-lisible">
        Nous utilisons des cookies de mesure d’audience pour savoir quelles pages sont consultées.
        Aucun cookie n’est déposé sans votre accord.
        <a href="${e(DATA.marque.confidentialiteUrl)}" target="_blank" rel="noopener" class="underline">En savoir plus</a>
      </p>
      <div class="flex gap-3 shrink-0">
        <!-- Refuser et Accepter ont le même poids visuel (exigence CNIL). -->
        <button data-refus class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white">Refuser</button>
        <button data-accord class="rounded-lg bg-primary-600 px-5 py-2.5 text-sm font-semibold text-white">Accepter</button>
      </div>
    </div>`;
  document.body.appendChild(b);
  b.querySelector('[data-accord]').onclick = () => { ecrireChoix('ok'); chargerTags(); b.remove(); };
  b.querySelector('[data-refus]').onclick  = () => { ecrireChoix('non'); b.remove(); };
}

if (GTM_ID) {
  const choix = lireChoix();
  if (choix === 'ok') chargerTags();
  else if (choix !== 'non') banniere();
  /* Retrait du consentement : on efface le choix et on rouvre le bandeau.
     Des tags déjà chargés ne se déchargent pas : on recharge la page après un refus. */
  document.querySelectorAll('[data-gerer-cookies]').forEach(btn => btn.addEventListener('click', () => {
    const avait = lireChoix() === 'ok';
    ecrireChoix(null);
    banniere();
    const refus = document.querySelector('#bandeau-cookies [data-refus]');
    if (avait && refus) refus.addEventListener('click', () => location.reload());
  }));
}
</script>
